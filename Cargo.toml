[package]
name = "sbconfig"
version = "0.1.2"
edition = "2021"
description = "TUI tool for managing sing-box SSH proxy configurations"
authors = ["typerhack"]
license = "MIT"
repository = "https://github.com/typerhack/sbconfig"
keywords = ["sing-box", "ssh", "proxy", "tui"]
categories = ["command-line-utilities"]

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# SSH key generation
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "rand_core"] }
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# QR code generation
qrcode = "0.14"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Encryption (for private key storage)
aes-gcm = "0.10"
base64 = "0.22"

# Logging
log = "0.4"
env_logger = "0.11"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID for session IDs
uuid = { version = "1.0", features = ["v4"] }

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for better optimization
panic = "abort"     # Abort on panic (smaller binary)
strip = true        # Strip symbols
